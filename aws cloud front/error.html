<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Error</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #ff416c, #ff4b2b);
      color: white;
    }

    .container {
      text-align: center;
      padding: 40px;
    }

    h1 {
      font-size: 6rem;
      margin-bottom: 10px;
    }

    h2 {
      font-size: 2rem;
      margin-bottom: 15px;
    }

    p {
      font-size: 1rem;
      opacity: 0.9;
      margin-bottom: 25px;
    }

    .btn {
      display: inline-block;
      padding: 12px 24px;
      background: white;
      color: #ff4b2b;
      text-decoration: none;
      border-radius: 30px;
      font-weight: bold;
      transition: 0.3s ease;
    }

    .btn:hover {
      transform: translateY(-3px);
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>404</h1>
    <h2>Oops!</h2>
    <p>The page you are looking for does not exist.</p>
    <a href="/" class="btn">Go Home</a>
  </div>
</body>
</html>
